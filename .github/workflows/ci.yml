name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    # Dependency-free core: the tests run with plain Python on the three systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python domaininfo.py --doctor
      - run: python domaininfo.py --lang es --help
      - name: Windows launcher
        if: runner.os == 'Windows'
        run: .\domaininfo.cmd --doctor
  quality:
    # Development tools (not part of the core). No traffic to real targets: tests use local servers.
    runs-on: ubuntu-latest
    env:
      NEW_MODULES: >-
        safety.py evidence.py webapp.py tools.py authscope.py session_audit.py apispec.py zapclient.py
        browser.py runners.py vulnintel.py inventory.py auditstore.py exporters.py server.py i18n.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install hypothesis ruff bandit pyright fastapi uvicorn httpx
      - name: Tests with property-based tests and the Security Center extra
        run: python -m unittest discover -s tests
      - name: Ruff
        run: |
          ruff check --select E9,F .
          ruff check --select E9,F,B,S --ignore S101 $NEW_MODULES
      - name: Bandit
        run: |
          bandit -q -ll $NEW_MODULES
          bandit -q -lll -c pyproject.toml -r .
      - name: Pyright (6.0 modules)
        run: pyright --pythonversion 3.10 $NEW_MODULES
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n domaininfo.sh install.sh
          for script in modules/*.sh; do bash -n "$script"; done
      - run: bash tests/test_legacy.sh
