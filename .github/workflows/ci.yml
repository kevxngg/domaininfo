name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    # Núcleo sin dependencias: las pruebas corren con Python estándar en los tres sistemas.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python domaininfo.py --doctor
      - name: Windows launcher
        if: runner.os == 'Windows'
        run: .\domaininfo.cmd --doctor
  quality:
    # Herramientas de desarrollo (no forman parte del núcleo). Sin red hacia objetivos reales:
    # las pruebas usan servidores locales.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install hypothesis ruff bandit pyright
      - name: Pruebas con propiedades (Hypothesis)
        run: python -m unittest discover -s tests
      - name: Ruff
        run: |
          ruff check --select E9,F .
          ruff check --select E9,F,B,S --ignore S101 safety.py evidence.py webapp.py tools.py
      - name: Bandit
        run: |
          bandit -q -ll safety.py evidence.py webapp.py tools.py
          bandit -q -lll -c pyproject.toml -r .
      - name: Pyright (módulos 6.0)
        run: pyright --pythonversion 3.10 safety.py evidence.py webapp.py tools.py
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n domaininfo.sh install.sh
          for script in modules/*.sh; do bash -n "$script"; done
      - run: bash tests/test_legacy.sh
