name: Package
# Builds the Security Center web UI, the wheel/sdist and the single-file zipapp as workflow
# artifacts. Nothing is published.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build web UI
        working-directory: webui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Committed dist matches the sources
        run: git diff --exit-code --stat -- webui/dist || echo "::warning::webui/dist differs from a fresh build; rebuild and commit it"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/
      - name: Zipapp
        run: |
          python scripts/build_zipapp.py -o dist/domaininfo.pyz
          python dist/domaininfo.pyz --version
      - name: Security Center tests (with the optional extra)
        run: |
          python -m pip install fastapi uvicorn httpx
          python -m unittest tests.test_phase4 -v
      - uses: actions/upload-artifact@v4
        with:
          name: domaininfo-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/domaininfo.pyz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist-${{ github.sha }}
          path: webui/dist
